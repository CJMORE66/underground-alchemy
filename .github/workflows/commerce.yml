name: Commerce safety checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run test:commerce
      - run: npm test
      - run: node tests/languages.mjs
      - run: node tests/languages-integration.mjs
      - run: npm run check:commerce-release
      - run: git diff --check
